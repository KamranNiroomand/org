[project]
name = "org-quant"
version = "0.1.0"
description = "Options pricing, features, training and backtesting sidecar for Org"
requires-python = ">=3.12"

# Kept deliberately lean. The machine this runs on has ~20 GB of free disk, so
# heavyweight extras are opt-in rather than pulled on first install.
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "polars>=1.17",
    "pyarrow>=18.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
]

[project.optional-dependencies]
# Model training. Installed when M2 starts.
ml = ["lightgbm>=4.5", "scikit-learn>=1.6"]
# Text embeddings. Pulls torch, roughly 2 GB — install only when M4 starts,
# and check free disk first.
text = ["sentence-transformers>=3.3"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
